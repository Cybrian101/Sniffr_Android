<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sniffr - Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#635979",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#cdc1e5",
                        "inverse-primary": "#ffb1c6",
                        "surface-container-high": "#ece7e7",
                        "on-secondary-container": "#004d65",
                        "on-tertiary-container": "#4b4260",
                        "secondary": "#0d6683",
                        "on-primary-fixed-variant": "#7d2747",
                        "on-tertiary": "#ffffff",
                        "background": "#fdf8f8",
                        "on-secondary-fixed": "#001f2a",
                        "on-surface": "#1c1b1c",
                        "surface-container": "#f2eded",
                        "on-secondary": "#ffffff",
                        "outline": "#8f6f76",
                        "surface-variant": "#e6e1e1",
                        "on-tertiary-fixed": "#1f1732",
                        "tertiary-container": "#eaddff",
                        "tertiary-fixed": "#eaddff",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1c1b1c",
                        "surface-dim": "#ddd9d9",
                        "surface-bright": "#fdf8f8",
                        "secondary-fixed": "#bee9ff",
                        "inverse-surface": "#323030",
                        "on-secondary-fixed-variant": "#004d65",
                        "surface-container-highest": "#e6e1e1",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#5b3f46",
                        "on-error-container": "#93000a",
                        "primary": "#9b3e5e",
                        "surface": "#fdf8f8",
                        "secondary-container": "#bee9ff",
                        "secondary-fixed-dim": "#8ad0f1",
                        "on-primary-fixed": "#3f001b",
                        "primary-container": "#ffd9e1",
                        "surface-tint": "#9b3e5e",
                        "outline-variant": "#e3bdc5",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f4f0f0",
                        "surface-container-low": "#f7f2f2",
                        "on-primary-container": "#7d2747",
                        "primary-fixed": "#ffd9e1",
                        "primary-fixed-dim": "#ffb1c6",
                        "on-tertiary-fixed-variant": "#4b4260"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen selection:bg-primary-container">
<!-- Signature Background Texture -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<span class="material-symbols-outlined absolute text-[240px] text-primary opacity-[0.03] -top-12 -left-12 rotate-12">pets</span>
<span class="material-symbols-outlined absolute text-[180px] text-primary opacity-[0.03] bottom-24 -right-12 -rotate-12">pets</span>
<span class="material-symbols-outlined absolute text-[120px] text-primary opacity-[0.02] top-1/2 left-1/4">potted_plant</span>
</div>
<main class="relative z-10 flex flex-col min-h-screen p-6 max-w-md mx-auto">
<!-- Hero Section consistent with Sign In -->
<header class="pt-12 pb-8 flex flex-col items-center">
<div class="relative w-48 h-48 mb-6">
<!-- Organic Blob Shapes for Logo Background -->
<div class="absolute inset-0 bg-primary-container rounded-[40%_60%_70%_30%/40%_50%_60%_40%] rotate-6 opacity-40"></div>
<div class="absolute inset-2 bg-tertiary-container rounded-[60%_40%_30%_70%/50%_60%_40%_50%] -rotate-3 opacity-40"></div>
<div class="absolute inset-0 flex items-center justify-center">
<img alt="Sniffr logo showing a happy dog and cat inside a heart shape" class="w-40 h-40 object-contain rounded-xl shadow-xl transform hover:scale-105 transition-transform duration-500" src="https://lh3.googleusercontent.com/aida/ADBb0ug3NnajVXvM0DHDtoQMrEvZRH_qrjkvqEJqhUYJt9j6H8GGuYXRIWXYw7zAHKh0898ZorioQFWbhS2Jgiu5EbPnU9x8U9OSUuOvefL5OaSy4aNa101hGQgRkX_v6kofHp3xL7u_QfvpRU-tPt1lHKJtUvB1spHvBTfdUD2ogw7iGhoPLyMwXkBpQ01B-jLoG8oaiFZS2of54AWQpvauodZouOQjxJobRPpI_yCcDGzBJiSI71ImeBw2Cdg"/>
</div>
</div>
<h1 class="text-4xl font-extrabold tracking-tighter text-primary text-center">Sniffr</h1>
<p class="text-on-surface-variant font-medium mt-2 text-center opacity-80">Find your pet's soulmate</p>
</header>
<!-- Form Card consistent with Sign In design language -->
<div class="bg-surface-container-lowest p-8 rounded-xl shadow-[0_10px_30px_-15px_rgba(0,0,0,0.05)] border border-outline-variant/10">
<header class="mb-8">
<h2 class="font-extrabold tracking-tighter text-2xl text-on-surface leading-tight text-center">Create your account</h2>
<p class="text-on-surface-variant text-xs mt-2 text-center opacity-80">Start your journey to find the perfect playmate.</p>
</header>
<form class="space-y-6" onsubmit="return false;">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant px-1" for="name">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface-variant/40 transition-all" id="name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-1.5">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface-variant/40 transition-all" id="email" placeholder="hello@sniffr.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-1.5">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-highest border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-on-surface-variant/40 transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button (Matching Sign In style) -->
<button class="w-full py-4 rounded-xl bg-gradient-to-br from-primary to-primary-fixed-dim text-on-primary font-bold text-lg shadow-[0_8px_20px_-6px_rgba(155,62,94,0.4)] hover:shadow-[0_12px_24px_-8px_rgba(155,62,94,0.6)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group mt-2" type="submit">
<span>Get Wagging</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
</div>
<!-- Secondary Action -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-sm font-medium">
            Already have an account? 
            <a class="text-primary font-bold hover:underline ml-1" href="#">Sign In</a>
</p>
</div>
<!-- Footer Copyright -->
<footer class="mt-auto py-8 text-center space-y-4">
<p class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant/60">© 2026 Sniffr.co.in</p>
<div class="flex justify-center gap-6">
<span class="material-symbols-outlined text-on-surface-variant/30 text-xl">star</span>
<span class="material-symbols-outlined text-on-surface-variant/30 text-xl">verified</span>
<span class="material-symbols-outlined text-on-surface-variant/30 text-xl">shield_with_heart</span>
</div>
</footer>
</main>
<!-- Bottom Gradient Fade -->
<div class="fixed bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-background to-transparent pointer-events-none z-20"></div>
</body></html>
