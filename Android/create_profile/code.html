<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PlushPaws - Pet Profile Creation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#635979",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "tertiary-fixed-dim": "#cdc1e5",
                    "inverse-primary": "#ffb1c6",
                    "surface-container-high": "#ece7e7",
                    "on-secondary-container": "#004d65",
                    "on-tertiary-container": "#4b4260",
                    "secondary": "#0d6683",
                    "on-primary-fixed-variant": "#7d2747",
                    "on-tertiary": "#ffffff",
                    "background": "#fdf8f8",
                    "on-secondary-fixed": "#001f2a",
                    "on-surface": "#1c1b1c",
                    "surface-container": "#f2eded",
                    "on-secondary": "#ffffff",
                    "outline": "#8f6f76",
                    "surface-variant": "#e6e1e1",
                    "on-tertiary-fixed": "#1f1732",
                    "tertiary-container": "#eaddff",
                    "tertiary-fixed": "#eaddff",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#1c1b1c",
                    "surface-dim": "#ddd9d9",
                    "surface-bright": "#fdf8f8",
                    "secondary-fixed": "#bee9ff",
                    "inverse-surface": "#323030",
                    "on-secondary-fixed-variant": "#004d65",
                    "surface-container-highest": "#e6e1e1",
                    "error-container": "#ffdad6",
                    "on-surface-variant": "#5b3f46",
                    "on-error-container": "#93000a",
                    "primary": "#9b3e5e",
                    "surface": "#fdf8f8",
                    "secondary-container": "#bee9ff",
                    "secondary-fixed-dim": "#8ad0f1",
                    "on-primary-fixed": "#3f001b",
                    "primary-container": "#ffd9e1",
                    "surface-tint": "#9b3e5e",
                    "outline-variant": "#e3bdc5",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f4f0f0",
                    "surface-container-low": "#f7f2f2",
                    "on-primary-container": "#7d2747",
                    "primary-fixed": "#ffd9e1",
                    "primary-fixed-dim": "#ffb1c6",
                    "on-tertiary-fixed-variant": "#4b4260"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .blob-shape {
            border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        }
        /* Custom Toggle Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #635979;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #eaddff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- Focused Header (No Global Shell) -->
<header class="px-6 pt-8 flex items-center justify-between">
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-low rounded-full active:scale-90 transition-transform">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex gap-1.5">
<div class="h-2 w-8 bg-tertiary-fixed rounded-full"></div>
<div class="h-2 w-8 bg-tertiary-fixed rounded-full"></div>
<div class="h-2 w-12 bg-tertiary rounded-full"></div>
<div class="h-2 w-8 bg-tertiary-fixed rounded-full"></div>
</div>
<div class="w-12 h-12"></div> <!-- Spacer for centering -->
</header>
<main class="px-8 mt-10">
<!-- Editorial Section -->
<section class="mb-10 relative">
<div class="absolute -top-6 -right-4 opacity-5 text-primary">
<span class="material-symbols-outlined text-[120px]" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<h1 class="text-4xl font-extrabold tracking-tight text-on-surface mb-2 leading-tight">
                Create a <span class="text-tertiary">Pawsome</span> Profile
            </h1>
<p class="text-on-surface-variant font-medium opacity-70">Tell us all the sweet details about your furry companion.</p>
</section>
<!-- Profile Form -->
<form class="space-y-8">
<!-- Basic Identity -->
<div class="space-y-5">
<div class="group">
<label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-tertiary-fixed-variant mb-2 ml-4">Pet Name</label>
<input class="w-full bg-surface-container-highest border-none rounded-lg px-6 py-4 focus:ring-2 focus:ring-tertiary/20 placeholder:text-stone-400" placeholder="e.g. Marshmallow" type="text"/>
</div>
<div class="group">
<label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-tertiary-fixed-variant mb-2 ml-4">Pet Username</label>
<div class="relative">
<span class="absolute left-6 top-1/2 -translate-y-1/2 text-tertiary font-bold">@</span>
<input class="w-full bg-surface-container-highest border-none rounded-lg pl-10 pr-6 py-4 focus:ring-2 focus:ring-tertiary/20 placeholder:text-stone-400" placeholder="handle" type="text"/>
</div>
</div>
</div>
<!-- Gender Selection (Editorial Asymmetry) -->
<div>
<label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-tertiary-fixed-variant mb-3 ml-4">Gender</label>
<div class="flex gap-4">
<label class="flex-1 cursor-pointer">
<input class="hidden peer" name="gender" type="radio"/>
<div class="bg-surface-container-low peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container text-stone-500 font-bold py-4 rounded-lg text-center transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">male</span>
                            Male
                        </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="hidden peer" name="gender" type="radio"/>
<div class="bg-surface-container-low peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container text-stone-500 font-bold py-4 rounded-lg text-center transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">female</span>
                            Female
                        </div>
</label>
</div>
</div>
<!-- Physical & Breed -->
<div class="grid grid-cols-2 gap-4">
<div class="col-span-1">
<label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-tertiary-fixed-variant mb-2 ml-4">Age</label>
<input class="w-full bg-surface-container-highest border-none rounded-lg px-6 py-4 focus:ring-2 focus:ring-tertiary/20 placeholder:text-stone-400" placeholder="Years" type="number"/>
</div>
<div class="col-span-1">
<label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-tertiary-fixed-variant mb-2 ml-4">Breed Type</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-highest border-none rounded-lg px-6 py-4 focus:ring-2 focus:ring-tertiary/20 text-on-surface">
<option>Original</option>
<option>Cross</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-stone-400">expand_more</span>
</div>
</div>
<div class="col-span-2">
<label class="block text-[10px] font-bold uppercase tracking-[0.05em] text-on-tertiary-fixed-variant mb-2 ml-4">Breed Name</label>
<input class="w-full bg-surface-container-highest border-none rounded-lg px-6 py-4 focus:ring-2 focus:ring-tertiary/20 placeholder:text-stone-400" placeholder="e.g. Golden Retriever" type="text"/>
</div>
</div>
<!-- Verification Toggles (Card Style) -->
<div class="bg-tertiary-container/30 p-6 rounded-lg space-y-6">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-tertiary-fixed flex items-center justify-center rounded-full text-tertiary">
<span class="material-symbols-outlined">vaccines</span>
</div>
<div>
<p class="font-bold text-on-tertiary-container">Vaccinated</p>
<p class="text-[10px] uppercase font-bold tracking-widest text-tertiary/60">Health Record Verified</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-container-high peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-tertiary"></div>
</label>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-tertiary-fixed flex items-center justify-center rounded-full text-tertiary">
<span class="material-symbols-outlined">verified_user</span>
</div>
<div>
<p class="font-bold text-on-tertiary-container">Pet KYC</p>
<p class="text-[10px] uppercase font-bold tracking-widest text-tertiary/60">Identity Shield</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-8 bg-surface-container-high peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-tertiary"></div>
</label>
</div>
</div>
</form>
</main>
<!-- Navigation Footer -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-xl px-8 py-8 flex items-center justify-between z-50">
<button class="px-8 py-4 text-tertiary font-bold hover:opacity-70 active:scale-95 transition-all">
            Previous
        </button>
<button class="bg-gradient-to-br from-primary to-primary-fixed-dim text-white px-12 py-4 rounded-xl font-bold shadow-[0_20px_40px_-15px_rgba(155,62,94,0.3)] hover:shadow-none active:scale-95 transition-all flex items-center gap-2">
            Next
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<!-- Signature Texture Blobs -->
<div class="fixed -bottom-10 -left-10 w-40 h-40 bg-tertiary-container/20 blob-shape -z-10 blur-2xl"></div>
<div class="fixed top-1/4 -right-20 w-64 h-64 bg-primary-container/10 blob-shape -z-10 blur-3xl"></div>
</body></html>
